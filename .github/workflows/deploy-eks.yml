name: Deploy to EKS

on:
  push:
    branches: [integration-local]

env:
  AWS_REGION: us-east-2
  ECR_REGISTRY: 425449348496.dkr.ecr.us-east-2.amazonaws.com
  EKS_CLUSTER: linkedin-simulation

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push services
        run: |
          docker buildx create --use --name multiarch 2>/dev/null || true
          for service in profile_service job-service application-service messaging-service analytics-service connection-service ai_service; do
            name=$(echo $service | sed 's/_service//' | sed 's/-service//')
            docker buildx build --platform linux/amd64 \
              -t $ECR_REGISTRY/linkedin/$name-api:latest \
              -f services/$service/Dockerfile . --push || true
          done
          docker buildx build --platform linux/amd64 \
            -t $ECR_REGISTRY/linkedin/analytics-worker:latest \
            -f services/analytics-service/Dockerfile . --push

      - name: Build and push frontend
        run: |
          cd client
          npm install
          npm run build
          docker buildx build --platform linux/amd64 \
            -t $ECR_REGISTRY/linkedin/frontend:latest \
            -f Dockerfile . --push

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER

      - name: Rollout restart all deployments
        run: |
          kubectl rollout restart deployment -n linkedin
          kubectl rollout status deployment -n linkedin --timeout=300s

      - name: Create Kafka topics
        run: |
          KAFKA_POD=$(kubectl get pod -n linkedin -l app=kafka -o jsonpath='{.items[0].metadata.name}')
          for topic in job.viewed job.saved job.applied job.created job.updated job.closed application.submitted application.status.updated message.sent connection.requested connection.accepted connection.rejected profile.viewed ai.requests ai.results analytics.events; do
            kubectl exec -n linkedin $KAFKA_POD -- kafka-topics.sh --bootstrap-server kafka-broker:9092 --create --topic $topic --partitions 1 --replication-factor 1 2>/dev/null || true
          done
