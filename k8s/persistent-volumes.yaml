kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
  namespace: linkedin
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp2
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
