# Messaging API
apiVersion: apps/v1
kind: Deployment
metadata:
  name: messaging-api
  namespace: linkedin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: messaging-api
  template:
    metadata:
      labels:
        app: messaging-api
    spec:
      containers:
      - name: messaging-api
        image: 425449348496.dkr.ecr.us-east-2.amazonaws.com/linkedin/messaging-api:latest
        ports:
        - containerPort: 8004
        command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8004"]
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: kafka-broker:9092
        - name: MYSQL_HOST
          value: mysql
        - name: MYSQL_PORT
          value: "3306"
        - name: MYSQL_DATABASE
          value: linkedin_db
        - name: MYSQL_USER
          value: appuser
        - name: MYSQL_PASSWORD
          value: apppassword
        - name: MONGO_HOST
          value: mongodb
        - name: MONGO_PORT
          value: "27017"
        - name: MONGO_DATABASE
          value: linkedin_events
        - name: MONGO_USER
          value: root
        - name: MONGO_PASSWORD
          value: rootpassword
        - name: REDIS_HOST
          value: redis
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          value: redispassword
        - name: DATABASE_URL
          value: mysql+pymysql://appuser:apppassword@mysql:3306/linkedin_db
---
apiVersion: v1
kind: Service
metadata:
  name: messaging-api
  namespace: linkedin
spec:
  selector:
    app: messaging-api
  ports:
  - port: 8004
---
