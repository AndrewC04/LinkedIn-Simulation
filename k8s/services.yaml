# Profile API
apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile-api
  namespace: linkedin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: profile-api
  template:
    metadata:
      labels:
        app: profile-api
    spec:
      containers:
      - name: profile-api
        image: 425449348496.dkr.ecr.us-east-2.amazonaws.com/linkedin/profile-api:latest
        ports:
        - containerPort: 8001
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: kafka-broker:9092
        - name: MYSQL_HOST
          value: mysql
        - name: MYSQL_PORT
          value: "3306"
        - name: REDIS_HOST
          value: redis
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          value: redispassword
        - name: DATABASE_URL
          value: mysql+pymysql://appuser:apppassword@mysql:3306/linkedin_db
---
apiVersion: v1
kind: Service
metadata:
  name: profile-api
  namespace: linkedin
spec:
  selector:
    app: profile-api
  ports:
  - port: 8001
---
