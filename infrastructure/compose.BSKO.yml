version: '3.8'
services:
  job-api:
    environment:
      REDIS_ENABLED: "true"
      KAFKA_ENABLED: "true"
      REDIS_CACHE_TTL: "600"
      DB_POOL_SIZE: "30"
      DB_MAX_OVERFLOW: "60"
      REDIS_MAX_CONNECTIONS: "100"
  application-api:
    environment:
      ENABLE_KAFKA: "true"
  analytics-worker:
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
