version: '3.8'

services:

  # ── Kafka needs Zookeeper to manage cluster state ──
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on: [zookeeper]
    ports:
      - "9092:9092"    # services connect here from their containers
      - "29092:29092"  # host machine connects here (for local testing)
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"  # we create topics explicitly

  # ── Runs our topic-creation script on startup ──
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    depends_on: [kafka]
    volumes:
      - ./kafka/topics-init.sh:/topics-init.sh
    entrypoint: ["/bin/bash", "/topics-init.sh"]

  # ── MySQL for transactional data ──
  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: linkedin_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql

  # ── MongoDB for events, messages, agent traces ──
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
      MONGO_INITDB_DATABASE: linkedin_events
    volumes:
      - mongo_data:/data/db
      - ./mongo/init.js:/docker-entrypoint-initdb.d/init.js

  # ── Redis for caching job/profile lookups ──
  redis:
    image: redis:7.2
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf

  # ── Messaging API (P6) ──
  messaging-api:
    build:
      context: ..
      dockerfile: services/messaging-service/Dockerfile
    container_name: messaging-api
    depends_on:
      - kafka
      - mysql
      - mongodb
      - redis
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: linkedin_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DATABASE: linkedin_events
      MONGO_USER: root
      MONGO_PASSWORD: rootpassword
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redispassword

    ports:
      - "8004:8004"
    command: uvicorn main:app --host 0.0.0.0 --port 8004

  # ── Messaging worker (P6) ──
  messaging-worker:
    build:
      context: ..
      dockerfile: services/messaging-service/Dockerfile
    container_name: messaging-worker
    depends_on:
      - kafka
      - mysql
      - mongodb
      - redis
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: linkedin_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DATABASE: linkedin_events
      MONGO_USER: root
      MONGO_PASSWORD: rootpassword
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redispassword
    command: python worker.py

  # ── Connections API (P6) ──
  connection-api:
    build:
      context: ..
      dockerfile: services/connection-service/Dockerfile
    container_name: connection-api
    depends_on:
      - kafka
      - mysql
      - mongodb
      - redis
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MYSQL_HOST: mysql
      MONGO_HOST: mongodb
      REDIS_HOST: redis
    ports:
      - "8007:8007"
    command: uvicorn main:app --host 0.0.0.0 --port 8007

  # ── Connections worker (P6) ──
  connection-worker:
    build:
      context: ..
      dockerfile: services/connection-service/Dockerfile
    container_name: connection-worker
    depends_on:
      - kafka
      - mysql
      - mongodb
      - redis
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MYSQL_HOST: mysql
      MONGO_HOST: mongodb
      REDIS_HOST: redis
    command: python worker.py

  # ── Profile API (P3) ──
  profile-api:
    build:
      context: ..
      dockerfile: services/profile_service/Dockerfile
    container_name: profile-api
    depends_on:
      - kafka
      - mysql
      - mongodb
      - redis
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: linkedin_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
      MONGO_HOST: mongodb
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redispassword
    ports:
      - "8001:8001"
    volumes:
      - profile_uploads:/app/uploads

  # ── Job API (P4) ──
  job-api:
    build:
      context: ..
      dockerfile: services/job-service/Dockerfile
    container_name: job-api
    depends_on:
      - kafka
      - mysql
      - redis
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: linkedin_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
      DATABASE_URL: mysql+pymysql://appuser:apppassword@mysql:3306/linkedin_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redispassword
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ENABLED: "false"
    ports:
      - "8002:8002"

  # ── Application API (P5) ──
  application-api:
    build:
      context: ..
      dockerfile: services/application-service/Dockerfile
    container_name: application-api
    depends_on:
      - mysql
      - kafka
    environment:
      APP_NAME: application-service
      APP_ENV: docker
      APP_HOST: 0.0.0.0
      APP_PORT: 8003
      DATABASE_URL: mysql+pymysql://appuser:apppassword@mysql:3306/linkedin_db
      ENABLE_KAFKA: "false"
      JOB_SERVICE_URL: http://job-api:8002
      PROFILE_SERVICE_URL: http://profile-api:8001
    ports:
      - "8003:8003"

  # ── Analytics API (P7) ──
  analytics-api:
    build:
      context: ..
      dockerfile: services/analytics-service/Dockerfile
    container_name: analytics-api
    depends_on:
      - kafka
      - mysql
      - mongodb
      - redis
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: linkedin_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DATABASE: linkedin_events
      MONGO_USER: root
      MONGO_PASSWORD: rootpassword
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redispassword
    ports:
      - "8005:8005"

  # ── AI API (P8) ──
  ai-api:
    build:
      context: ..
      dockerfile: services/ai_service/Dockerfile
    container_name: ai-api
    depends_on:
      - kafka
      - mongodb
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC_REQUESTS: ai.requests
      KAFKA_TOPIC_RESULTS: ai.results
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USER: root
      MONGO_PASSWORD: rootpassword
      MONGO_DATABASE: linkedin_events
      OPENAI_API_KEY: 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
    ports:
      - "8006:8006"

volumes:
  mysql_data:
  mongo_data:
  profile_uploads: