version: '3.8'

services:

  # ── Kafka needs Zookeeper to manage cluster state ──
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on: [zookeeper]
    ports:
      - "9092:9092"    # services connect here from their containers
      - "29092:29092"  # host machine connects here (for local testing)
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"  # we create topics explicitly

  # ── Runs our topic-creation script on startup ──
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    depends_on: [kafka]
    volumes:
      - ./kafka/topics-init.sh:/topics-init.sh
    entrypoint: ["/bin/bash", "/topics-init.sh"]

  # ── MySQL for transactional data ──
  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: linkedin_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql

  # ── MongoDB for events, messages, agent traces ──
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
      MONGO_INITDB_DATABASE: linkedin_events
    volumes:
      - mongo_data:/data/db
      - ./mongo/init.js:/docker-entrypoint-initdb.d/init.js

  # ── Redis for caching job/profile lookups ──
  redis:
    image: redis:7.2
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf

  # ── Messaging API (P6) ──
  messaging-api:
    build:
      context: ..
      dockerfile: services/messaging-service/Dockerfile
    container_name: messaging-api
    depends_on:
      - kafka
      - mysql
      - mongodb
      - redis
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MYSQL_HOST: mysql
      MONGO_HOST: mongodb
      REDIS_HOST: redis
    ports:
      - "8004:8004"
    command: uvicorn main:app --host 0.0.0.0 --port 8004

  # ── Messaging worker (P6) ──
  messaging-worker:
    build:
      context: ..
      dockerfile: services/messaging-service/Dockerfile
    container_name: messaging-worker
    depends_on:
      - kafka
      - mysql
      - mongodb
      - redis
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MYSQL_HOST: mysql
      MONGO_HOST: mongodb
      REDIS_HOST: redis
    command: python worker.py

  # ── Connections API (P6) ──
  connection-api:
    build:
      context: ..
      dockerfile: services/connection-service/Dockerfile
    container_name: connection-api
    depends_on:
      - kafka
      - mysql
      - mongodb
      - redis
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MYSQL_HOST: mysql
      MONGO_HOST: mongodb
      REDIS_HOST: redis
    ports:
      - "8007:8007"
    command: uvicorn main:app --host 0.0.0.0 --port 8007

  # ── Connections worker (P6) ──
  connection-worker:
    build:
      context: ..
      dockerfile: services/connection-service/Dockerfile
    container_name: connection-worker
    depends_on:
      - kafka
      - mysql
      - mongodb
      - redis
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MYSQL_HOST: mysql
      MONGO_HOST: mongodb
      REDIS_HOST: redis
    command: python worker.py

volumes:
  mysql_data:
  mongo_data: